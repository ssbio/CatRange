# api.catrange.sahassbio.com — backend only.
#
# catrange.sahassbio.com's Hostinger plan (Premium Web Hosting) is shared
# hosting and cannot run this Docker stack. The static frontend
# (webapp/frontend/) is uploaded there directly (see webapp/README.md); this
# nginx, running on your separate Docker/GPU server, only needs to serve the
# ACME challenge and reverse-proxy the API — no static file serving here.
#
# Point a SECOND DNS record (e.g. api.catrange.sahassbio.com) at this
# server's IP; don't reuse the bare catrange.sahassbio.com name, since that
# one already points at Hostinger.
#
# STEP 1 (default state): plain HTTP only. This lets you bring the stack up,
# point DNS at this server, and successfully complete an ACME HTTP-01
# challenge (`docker compose run --rm certbot certonly --webroot -w
# /var/www/certbot -d api.catrange.sahassbio.com`) before any certificate
# exists.
server {
  listen 80;
  server_name api.catrange.sahassbio.com _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

