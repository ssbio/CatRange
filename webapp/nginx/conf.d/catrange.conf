# catrange.sahassbio.com
#
# STEP 1 (default state): plain HTTP only. This lets you bring the stack up,
# point DNS at this server, and successfully complete an ACME HTTP-01
# challenge (`docker compose run --rm certbot certonly --webroot -w
# /var/www/certbot -d catrange.sahassbio.com`) before any certificate exists.
server {
  listen 80;
  server_name catrange.sahassbio.com _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

